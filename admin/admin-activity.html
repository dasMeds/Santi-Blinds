<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Activity — Santi Blinds Admin</title>
  <link rel="icon" type="image/png" href="../images/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Quicksand:wght@300;400;500;600&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <img src="../images/SantiLogoNoBg.png" alt="Santi Blinds logo" />
        <span>SANTI <em>BLINDS</em></span>
      </div>
      <span class="section-label" style="padding-left:1.75rem;">Admin Panel</span>

      <nav class="admin-nav">
        <a href="admin-dashboard.html" class="admin-nav__link">Dashboard</a>
        <a href="admin-orders.html" class="admin-nav__link">Orders</a>
        <a href="admin-customizations.html" class="admin-nav__link">Customizations</a>
        <a href="admin-quotations.html" class="admin-nav__link">Quotations</a>
        <a href="admin-inventory.html" class="admin-nav__link">Inventory</a>
        <a href="admin-sales.html" class="admin-nav__link">Sales & Revenue</a>
        <a href="admin-customers.html" class="admin-nav__link">Customers</a>
        <a href="admin-activity.html" class="admin-nav__link active">Customer Activity</a>
        <a href="admin-reports.html" class="admin-nav__link">Reports</a>
        <a href="admin-audit.html" class="admin-nav__link">Audit Log</a>
      </nav>

      <div class="admin-sidebar__footer">
        <span id="adminName">—</span>
        <button id="logoutBtn" class="link-arrow">Log Out <span>→</span></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-view__header">
        <h1 class="section-title">Customer Activity</h1>
        <p class="section-desc">Registrations, logins, customizations, quotations, and orders from the public Order page.</p>
      </div>
      <div class="admin-toolbar">
        <select id="activityFilter"><option value="">All activity</option><option>Register</option><option>Login</option><option>Login failed</option><option>Logout</option><option>Customization saved</option><option>Customization updated</option><option>Quotation issued</option><option>Order placed</option><option>Purchase</option></select>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="activityTable">
          <thead><tr><th>When</th><th>Customer</th><th>Activity</th><th>Details</th><th>IP</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../javascript/script.js"></script>
</body>
</html>
