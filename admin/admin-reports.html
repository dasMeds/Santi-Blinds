<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Santi Blinds Admin</title>
  <link rel="icon" type="image/png" href="../images/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Quicksand:wght@300;400;500;600&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <img src="../images/SantiLogoNoBg.png" alt="Santi Blinds logo" />
        <span>SANTI <em>BLINDS</em></span>
      </div>
      <span class="section-label" style="padding-left:1.75rem;">Admin Panel</span>

      <nav class="admin-nav">
        <a href="admin-dashboard.html" class="admin-nav__link">Dashboard</a>
        <a href="admin-orders.html" class="admin-nav__link">Orders</a>
        <a href="admin-quotations.html" class="admin-nav__link">Quotations</a>
        <a href="admin-customizations.html" class="admin-nav__link">Customizations</a>
        <a href="admin-inventory.html" class="admin-nav__link">Inventory</a>
        <a href="admin-products.html" class="admin-nav__link">Add Products</a>
        <a href="admin-sales.html" class="admin-nav__link">Sales & Revenue</a>
        <a href="admin-customers.html" class="admin-nav__link">Customers</a>
        <a href="admin-reports.html" class="admin-nav__link active">Reports</a>
        <a href="admin-audit.html" class="admin-nav__link">Audit Log</a>
      </nav>

      <div class="admin-sidebar__footer">
        <span id="adminName">—</span>
        <button id="logoutBtn" class="link-arrow">Log Out <span>→</span></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-view__header">
        <h1 class="section-title">Reports</h1>
        <p class="section-desc">Generate an order &amp; revenue report for a date range.</p>
      </div>
      <div class="admin-toolbar">
        <input type="search" id="reportSearch" placeholder="Search customer, product, or order #" />
        <label>From <input type="date" id="reportFrom" /></label>
        <label>To <input type="date" id="reportTo" /></label>
        <select id="reportStatusFilter" aria-label="Filter report by order status">
          <option value="">All statuses</option><option>Pending</option><option>Processing</option>
          <option>Ready for Install</option><option>Completed</option><option>Cancelled</option>
        </select>
        <button id="runReportBtn" class="btn btn--ghost">Run Report</button>
        <button id="exportReportBtn" class="btn btn--primary">Export CSV</button>
      </div>
      <div class="admin-stats" id="reportStats"></div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="reportTable">
          <thead><tr><th>ID</th><th>Customer</th><th>Location</th><th>Product</th><th>Qty</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-pagination" id="reportsPagination"></div>
    </main>
  </div>

  <script src="../javascript/script.js"></script>
</body>
</html>
