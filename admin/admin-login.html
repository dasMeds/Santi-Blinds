<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Santi Blinds</title>
  <link rel="icon" type="image/png" href="../images/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Quicksand:wght@300;400;500;600&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-login-body">

  <div class="admin-login">
    <div class="admin-login__card">
      <div class="admin-login__brand">
        <img src="../images/SantiLogoNoBg.png" alt="Santi Blinds logo" />
        <span>SANTI <em>BLINDS</em></span>
      </div>
      <span class="section-label" style="text-align:center; display:block;">Admin Panel</span>
      <h1 class="admin-login__title">Sign In</h1>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>

        <p id="loginError" class="admin-login__error" hidden></p>

        <button type="submit" class="btn btn--primary btn--full">Log In</button>
      </form>
    </div>
  </div>

  <script src="../javascript/script.js"></script>
</body>
</html>
